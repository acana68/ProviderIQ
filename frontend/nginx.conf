# Serves the built app and proxies /api/ to the backend, so the browser sees one origin
# (no CORS), exactly like the Vite dev server's proxy. Included inside nginx's http block.

# Cache policy per path. Vite puts a content hash in every /assets/ file name, so they can
# be cached forever; anything else (index.html, SPA routes, favicon) must be revalidated so
# a deploy is picked up. An empty value adds no header: the API sets its own.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# The access log keeps what the API's own access log keeps: method, path without the query
# string, status and duration. No client address, query string (search criteria end up in
# /results?... URLs), referrer or user agent. See the Privacy page.
log_format privacy '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

# A coarse per-address limit in front of the API, so a flood is shed here before it
# reaches the backend: 10 requests a second, with bursts of up to 20. The backend's own
# per-minute limits (120, and 10 for AI parsing) stay the real policy. 10 MB of state
# holds about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log privacy;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers are set here, once, and inherited by every location below. (A location with
    # its own add_header would drop all of these, which is why caching uses the map above
    # instead of per-location add_header.)
    # Without `always`: only successful responses are cacheable, never a 404 under /assets/.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Everything the app loads comes from this origin: the Vite bundle has no inline scripts
    # or styles (React sets styles through the DOM, which CSP allows), fonts are system
    # fonts, and the API is proxied below. HSTS belongs with TLS, in front of this (Stage 14).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        # The API's own error shape, so the frontend handles it like the backend's 429.
        error_page 429 = @rate_limited;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends $remote_addr to whatever the client sent. The backend trusts this header
        # from nginx only, and takes its rightmost untrusted entry: $remote_addr.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A little above the backend's own limits (AI parse waits up to 8 s by default).
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests; please retry later","request_id":null}}';
    }

    # Hashed build output: a missing file is a real 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes (/results, /providers/7, ...) all get the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
