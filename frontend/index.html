<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The default title; each page sets its own (React <title>). -->
    <title>ProviderIQ</title>
    <meta
      name="description"
      content="Find and compare healthcare providers by quality, experience, cost and distance, with every score explained. An educational project: synthetic demo data by default, optional public CMS data. Not medical advice."
    />

    <!-- Link previews. The image is generated by `npm run og-image` (public/og-image.png);
         previews need an absolute URL, so it's served from the repository. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProviderIQ" />
    <meta
      property="og:title"
      content="ProviderIQ: compare healthcare providers, scores explained"
    />
    <meta
      property="og:description"
      content="Search providers by specialty, condition and location, and see how every score is built. An educational project with synthetic demo data by default. Not medical advice."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/acana68/ProviderIQ/main/frontend/public/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ProviderIQ: find and compare healthcare providers by quality, experience, cost and distance."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ProviderIQ: compare healthcare providers, scores explained"
    />
    <meta
      name="twitter:description"
      content="Search providers by specialty, condition and location, and see how every score is built. An educational project with synthetic demo data by default. Not medical advice."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/acana68/ProviderIQ/main/frontend/public/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="ProviderIQ: find and compare healthcare providers by quality, experience, cost and distance."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
