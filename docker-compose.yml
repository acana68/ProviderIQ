# The whole app in containers: `docker compose up --build`, then open http://localhost:8080.
# For day-to-day development, `npm run dev` (http://localhost:5173, hot reload) with a local
# uvicorn is still the workflow; `docker compose up -d db` starts just the database for it.

services:
  db:
    image: postgres:17
    container_name: provideriq-db
    # Reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB. These only take effect when the
    # data volume is first initialised; after changing them, recreate it with `docker compose down -v`.
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - provideriq-pgdata:/var/lib/postgresql/data
      # *.sql files here run once, on first init only (e.g. creating the test database).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container's shell, where env_file has set these.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      # The repo root, so the image can include data/ for seeding.
      context: .
      dockerfile: backend/Dockerfile
    container_name: provideriq-backend
    env_file: .env
    environment:
      # Inside the Compose network Postgres is "db" on 5432; .env's DATABASE_URL points at
      # localhost:5433, which is only right from the host. Built from the POSTGRES_* values
      # in .env, so the password lives in one place (keep it URL-safe: no @ : / ? #).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Load data/ on the first start (empty database). Later starts leave the data alone.
      SEED_IF_EMPTY: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # Same check as the image's HEALTHCHECK (there's no curl in python:slim).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 5
      # Covers migrations and the first-start seed.
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: provideriq-frontend
    depends_on:
      # nginx resolves "backend" when it starts, so the backend must be up first.
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  provideriq-pgdata:
    # Fixed name so Compose doesn't prefix it with the project name.
    name: provideriq-pgdata
