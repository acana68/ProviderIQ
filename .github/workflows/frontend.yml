name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dockerfile uses the Node version in .nvmrc
        run: |
          node="$(tr -d '[:space:]' < .nvmrc)"
          expected="FROM node:${node}-alpine@sha256:<digest> AS build"
          grep -qE "^FROM node:${node}-alpine@sha256:[0-9a-f]{64} AS build$" Dockerfile || {
            echo "::error file=frontend/Dockerfile::Expected '$expected' to match .nvmrc"
            exit 1
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
