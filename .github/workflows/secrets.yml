name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so a secret committed and then deleted is still found.
          fetch-depth: 0

      - name: Scan every commit
        # The gitleaks CLI from its official image, pinned by digest: no third-party
        # action and no token. --redact keeps any finding's value out of the log. The
        # safe.directory setting lets git in the container read the runner's checkout.
        run: >
          docker run --rm
          -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact=100 --no-banner --exit-code 1
