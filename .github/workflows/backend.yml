name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        # A throwaway database that only exists for this job: not a real secret.
        env:
          POSTGRES_USER: provideriq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: provideriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provideriq -d provideriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app database and the test database must differ: the suite migrates the test
      # database and rolls back each test's writes there.
      DATABASE_URL: postgresql+psycopg://provideriq:ci-only-password@localhost:5432/provideriq
      TEST_DATABASE_URL: postgresql+psycopg://provideriq:ci-only-password@localhost:5432/provideriq_test
      # Keyword parser only: CI never calls the Anthropic API (live tests stay deselected).
      AI_PROVIDER: none
      PGPASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the test database
        # Locally, db/init/ does this when the Compose volume is created.
        run: psql -h localhost -U provideriq -d provideriq -c "CREATE DATABASE provideriq_test"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        # pyproject.toml's addopts deselects the live (real API) tests.
        run: pytest
