name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # 17.11, the same digest as docker-compose.yml. Dependabot doesn't update service
        # images in workflows, so bump this together with the Compose file's.
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        # A throwaway database that only exists for this job: not a real secret.
        env:
          POSTGRES_USER: provideriq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: provideriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provideriq -d provideriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app database and the test database must differ: the suite migrates the test
      # database and rolls back each test's writes there.
      DATABASE_URL: postgresql+psycopg://provideriq:ci-only-password@localhost:5432/provideriq
      TEST_DATABASE_URL: postgresql+psycopg://provideriq:ci-only-password@localhost:5432/provideriq_test
      # Keyword parser only: CI never calls the Anthropic API (live tests stay deselected).
      AI_PROVIDER: none
      PGPASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the test database
        # Locally, db/init/ does this when the Compose volume is created.
        run: psql -h localhost -U provideriq -d provideriq -c "CREATE DATABASE provideriq_test"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        # pyproject.toml's addopts deselects the live (real API) tests.
        run: pytest
