name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: Build, start, and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env from the example
        # Placeholder values only (throwaway database, AI_PROVIDER=none, no API key).
        run: cp .env.example .env

      - name: Build and start the stack
        # --wait returns once every service is running and healthy (or fails on timeout).
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: python3 backend/scripts/smoke_test.py http://localhost:8080

      - name: Show status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop and remove
        if: always()
        run: docker compose down --volumes
