[project]
name = "provideriq-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: don't hand-wrap long op.create_table(...) lines.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as ours.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
