# Alembic config. There is deliberately no sqlalchemy.url here: alembic/env.py reads
# DATABASE_URL from the app Settings (repo-root .env), so there's one source of truth.
# Run alembic commands from backend/.

[alembic]
script_location = %(here)s/alembic
# Makes `import app...` work in env.py.
prepend_sys_path = %(here)s
path_separator = os
# e.g. 2026_09_25-3f2a1c9d0e4b_create_initial_tables.py (sorts by date in the file browser)
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Format new revision files with ruff, so autogenerated migrations pass `ruff format --check`
# in CI. Runs `python -m ruff` (a dev dependency), so it works on any OS.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
